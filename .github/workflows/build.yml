name: build

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      versions_json:
        description: versions.json content to build (defaults to the checked-in file)
        type: string
        default: ""
      publish:
        description: push images to GHCR
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/metril/unifi-protect
  FWDEBS: ghcr.io/metril/unifi-protect-fwdebs
  PUBLISH: ${{ inputs.publish || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  unit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt && python -m pytest -n auto -m "not container" tests/

  fwdebs:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.out.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: v
        uses: ./.github/actions/versions
        with:
          versions_json: ${{ inputs.versions_json }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Check for published fwdebs image
        id: check
        run: |
          if docker manifest inspect "$FWDEBS:${{ steps.v.outputs.fw_tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push fwdebs
        if: steps.check.outputs.exists != 'true' && env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: fwdebs
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.FWDEBS }}:${{ steps.v.outputs.fw_tag }}
          build-args: ${{ steps.v.outputs.build_args }}
      - id: out
        run: |
          if [ "${{ steps.check.outputs.exists }}" = true ] || [ "$PUBLISH" = true ]; then
            echo "image=$FWDEBS:${{ steps.v.outputs.fw_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image=" >> "$GITHUB_OUTPUT"   # empty: build the stage locally
          fi

  build:
    needs: fwdebs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: v
        uses: ./.github/actions/versions
        with:
          versions_json: ${{ inputs.versions_json }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          target: protect
          platforms: linux/arm64
          load: true
          provenance: false
          sbom: false
          tags: unifi-protect:ci
          build-args: |
            ${{ steps.v.outputs.build_args }}
            FWDEBS_IMAGE=${{ needs.fwdebs.outputs.image || 'fwdebs' }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: ${{ env.PUBLISH == 'true' && format('type=registry,ref={0}:buildcache,mode=max', env.IMAGE) || '' }}
      - name: Save image
        run: docker save unifi-protect:ci | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  test:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, upgrade]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load && pip install -r requirements-dev.txt
      - name: Resolve previous image for the upgrade test
        if: matrix.suite == 'upgrade'
        run: |
          for ref in "$IMAGE:stable" "${{ vars.OLD_IMAGE_FALLBACK }}"; do
            [ -n "$ref" ] || continue
            if docker pull "$ref" >/dev/null 2>&1; then echo "OLD_IMAGE=$ref" >> "$GITHUB_ENV"; break; fi
          done
      - name: Run ${{ matrix.suite }} tests
        env:
          IMAGE: unifi-protect:ci
        run: python -m pytest -n auto -m container -k ${{ matrix.suite }} tests/test_container.py

  publish:
    needs: [unit, build, test]
    if: inputs.publish || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: v
        uses: ./.github/actions/versions
        with:
          versions_json: ${{ inputs.versions_json }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: image
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tags
        run: |
          set -euo pipefail
          gunzip -c image.tar.gz | docker load
          short="${GITHUB_SHA::7}"
          new_ver="${{ steps.v.outputs.image_version }}"
          if docker pull "$IMAGE:stable" >/dev/null 2>&1 \
             && [ "$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE:stable")" != "$new_ver" ]; then
            docker tag "$IMAGE:stable" "$IMAGE:previous"
            docker push "$IMAGE:previous"
          fi
          for t in stable "${{ steps.v.outputs.protect_version }}" "sha-$short"; do
            docker tag unifi-protect:ci "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done

  build-result:
    needs: [unit, fwdebs, build, test, publish]
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any job failed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' >/dev/null
